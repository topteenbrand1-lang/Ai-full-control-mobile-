name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip -o AI-Full-Control-Phone-v1.0.0-source.zip -d extracted_app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Gradle Project
        run: |
          # Find directory containing gradlew
          GRADLE_DIR=$(find extracted_app -name "gradlew" -exec dirname {} \;)
          if [ -n "$GRADLE_DIR" ]; then
            echo "Found Gradle project in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew file not found in extracted zip!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
