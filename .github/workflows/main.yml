name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          unzip -o AI-Full-Control-Phone-v1.0.0-source.zip -d extracted_app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Gradle Project
        run: |
          # Search the entire workspace for gradlew
          GRADLE_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            GRADLE_DIR=$(dirname "$GRADLE_FILE")
            echo "Found Gradle project in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
