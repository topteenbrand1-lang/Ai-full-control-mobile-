name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Large Zip File
        run: |
          echo "Checking file size and presence..."
          ls -lh AI-Full-Control-Phone-v1.0.0-source.zip || find . -name "*.zip" -ls

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "Extracting large zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          echo "=== Top directories inside extracted_app ==="
          ls -la extracted_app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Project
        run: |
          echo "Searching for build.gradle..."
          BUILD_FILE=$(find extracted_app -name "build.gradle" -type f | head -n 1)
          
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found build.gradle in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "Generating gradle wrapper..."
              gradle wrapper || true
              if [ -f "./gradlew" ]; then
                chmod +x gradlew
                ./gradlew assembleDebug
              else
                gradle assembleDebug
              fi
            fi
          else
            echo "ERROR: build.gradle still not found. Listing all extracted contents:"
            find extracted_app -maxdepth 3
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
