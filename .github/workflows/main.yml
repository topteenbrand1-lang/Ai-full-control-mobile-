name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List all files in repo
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Looking for any zip files ==="
          find . -name "*.zip"

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_app
          else
            echo "ERROR: No zip file found in repository!"
            exit 1
          fi
          echo "=== Listing all files after extraction ==="
          find extracted_app -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Project
        run: |
          # Search for build.gradle anywhere
          BUILD_FILE=$(find . -name "build.gradle" -type f | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found build.gradle in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "gradlew not found, generating wrapper..."
              gradle wrapper || true
              if [ -f "./gradlew" ]; then
                chmod +x gradlew
                ./gradlew assembleDebug
              else
                gradle assembleDebug
              fi
            fi
          else
            echo "ERROR: build.gradle not found anywhere in the repository!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
