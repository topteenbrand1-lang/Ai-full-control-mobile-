name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files for debugging
        run: |
          echo "=== Root Files ==="
          ls -la

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          # Find zip file automatically in case name differs slightly
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_app
          else
            echo "Error: No zip file found!"
            exit 1
          fi
          echo "=== Extracted Files ==="
          ls -la extracted_app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Gradle Project
        run: |
          # Search for gradlew in the workspace
          GRADLE_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            GRADLE_DIR=$(dirname "$GRADLE_FILE")
            echo "Found Gradle project in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew file not found anywhere!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
