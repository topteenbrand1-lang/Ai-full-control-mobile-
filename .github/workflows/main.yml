name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_app
          echo "=== Contents of extracted_app ==="
          find extracted_app -maxdepth 3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Project
        run: |
          # Search for gradlew
          GRADLEW_FILE=$(find extracted_app -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_FILE" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found, searching for build.gradle..."
            BUILD_FILE=$(find extracted_app -name "build.gradle" -type f | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              BUILD_DIR=$(dirname "$BUILD_FILE")
              echo "Found build.gradle in: $BUILD_DIR"
              cd "$BUILD_DIR"
              gradle wrapper || true
              if [ -f "./gradlew" ]; then
                chmod +x gradlew
                ./gradlew assembleDebug
              else
                echo "Error: Could not generate gradlew wrapper."
                exit 1
              fi
            else
              echo "Error: Project files not found in the zip archive!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
