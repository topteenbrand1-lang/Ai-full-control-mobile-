name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "Extracting zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Project
        run: |
          # Go directly to the verified project directory
          cd extracted_app/AI-Full-Control-Phone
          
          echo "Current working directory: $(pwd)"
          ls -la
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew wrapper not found, generating..."
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              gradle assembleDebug
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
