name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug and List Files
        run: |
          echo "--- Root Directory Contents ---"
          ls -la
          echo "--- Checking for ZIP file ---"
          if [ -f "AI-Full-Control-Phone-v1.0.0-source.zip" ]; then
            echo "ZIP file found directly in root!"
          else
            echo "ZIP file not found in root, searching..."
            find . -name "*.zip"
          fi

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          ZIP_NAME="AI-Full-Control-Phone-v1.0.0-source.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Unzipping $ZIP_NAME..."
            unzip -o "$ZIP_NAME" -d extracted_app
          else
            FOUND_ZIP=$(find . -name "*.zip" | head -n 1)
            echo "Unzipping found zip: $FOUND_ZIP"
            unzip -o "$FOUND_ZIP" -d extracted_app
          fi
          echo "--- Contents of extracted_app ---"
          ls -la extracted_app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Project
        run: |
          echo "Searching for build.gradle inside extracted_app..."
          BUILD_FILE=$(find extracted_app -name "build.gradle" -type f | head -n 1)
          
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found build.gradle in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            if [ -f "./gradlew" ]; then
              echo "Found gradlew, executing..."
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "gradlew not found, generating wrapper..."
              gradle wrapper || true
              if [ -f "./gradlew" ]; then
                chmod +x gradlew
                ./gradlew assembleDebug
              else
                echo "Trying direct gradle assembleDebug..."
                gradle assembleDebug
              fi
            fi
          else
            echo "ERROR: build.gradle not found in extracted_app!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
