name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List all repository files
        run: |
          echo "=== Root directory files ==="
          ls -la
          echo "=== Finding zip files ==="
          find . -name "*.zip"

      - name: Extract zip file
        run: |
          mkdir -p extracted_app
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_app
          else
            echo "Error: Zip file not found!"
            exit 1
          fi
          echo "=== Full list of extracted contents ==="
          find extracted_app -maxdepth 4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Project
        run: |
          # Search for gradlew or build.gradle anywhere in the workspace
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_FILE" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found, searching for build.gradle..."
            BUILD_FILE=$(find . -name "build.gradle" -type f | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              BUILD_DIR=$(dirname "$BUILD_FILE")
              echo "Found build.gradle in: $BUILD_DIR"
              cd "$BUILD_DIR"
              gradle wrapper || true
              if [ -f "./gradlew" ]; then
                chmod +x gradlew
                ./gradlew assembleDebug
              else
                gradle assembleDebug || {
                  echo "Error: Gradle build failed."
                  exit 1
                }
              fi
            else
              echo "Error: build.gradle not found anywhere in the repository!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
